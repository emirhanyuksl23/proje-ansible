services:
  web:
    build: .
    container_name: flask-ci-cd-app
    restart: always
    expose:
      - "5000"

  nginx:
    image: nginx:latest
    container_name: nginx-reverse-proxy
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - web
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
